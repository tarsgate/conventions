name: Pi Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pi-agent:
    # HACK: GitHub Actions expressions don't support escape sequences like \n in string literals,
    # so fromJSON('"\n"') is used to inject an actual newline character
    if: |
      contains(fromJson('["knocte", "webwarrior-ws"]'), github.actor) &&
      (startsWith(github.event.comment.body, '/pi ') || contains(github.event.comment.body, format('{0}/pi ', fromJSON('"\n"'))))
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # workaround for https://github.com/shaftoe/pi-coding-agent-action/issues/413
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_REPO_BOT_ACCESS_TOKEN }}

      - name: Run Pi agent
        id: pi-step

        # f7496a9aea9798c5d52d39096d98d5c5b16559b3 = v2.30.0 ( which depends on Pi v1.0.4 )
        uses: tarsgate/pi-coding-agent-action@f7496a9aea9798c5d52d39096d98d5c5b16559b3

        # we want to still upload session artifacts even if it fails (to diagnose problems)
        continue-on-error: true

        with:
          github_token: ${{ secrets.GH_REPO_BOT_ACCESS_TOKEN }}
          provider: nanogpt
          model: auto-model
          token: ${{ secrets.NANOGPT_API_KEY }}
          branch_name_template: "wip/pi/issue{number}-{title}-{timestamp}"
          export_session_html: true
          export_session_jsonl: true
          extensions: |
            npm:awto-pi-lot

      - uses: actions/upload-artifact@v7
        if: ${{ steps.pi-step.outputs.session_html_path}}
        with:
          name: pi-session-html-${{ github.event.issue.number || github.event.pull_request.number || github.run_number }}
          path: |
            ${{ steps.pi-step.outputs.session_html_path }}

      - uses: actions/upload-artifact@v7
        if: ${{ steps.pi-step.outputs.session_jsonl_path}}
        with:
          name: pi-session-jsonl-${{ github.event.issue.number || github.event.pull_request.number || github.run_number }}
          path: |
            ${{ steps.pi-step.outputs.session_jsonl_path }}

      # just to avoid "continue-on-error: true" marking this job as green if it failed
      - name: Job Status Check
        if: always()
        run: |
          if [ "${{ steps.pi-step.outcome }}" = "failure" ]; then
            echo "The Pi step failed during execution. Marking workflow as failed."
            exit 1
          fi
          echo "Workflow run successfully!"
