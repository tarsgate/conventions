name: Pi Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pi-agent:
    # HACK: GitHub Actions expressions don't support escape sequences like \n in string literals,
    # so fromJSON('"\n"') is used to inject an actual newline character
    if: |
      contains(fromJson('["knocte", "webwarrior-ws"]'), github.actor) &&
      (startsWith(github.event.comment.body, '/pi ') || contains(github.event.comment.body, format('{0}/pi ', fromJSON('"\n"'))))
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # workaround for https://github.com/shaftoe/pi-coding-agent-action/issues/413
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Pi agent
        # based on 3080387559da9f13ef1ebb6a6307b2d0b97a5885 = v2.29.1+ ( which depends on Pi v0.99.2 )
        uses: tarsgate/pi-coding-agent-action@develop
        with:
          github_token: ${{ secrets.GH_REPO_BOT_ACCESS_TOKEN }}
          provider: ppq
          model: auto
          token: ${{ secrets.PPQ_API_KEY }}
          extensions: |
            npm:awto-pi-lot
